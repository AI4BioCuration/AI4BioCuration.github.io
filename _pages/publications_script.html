<script type="text/javascript">
(function() {
  'use strict';
  
  function initFilter() {
    var filterButtons = document.querySelectorAll('.keyword-btn');
    var publications = document.querySelectorAll('.publication-item');
    
    console.log('Publications filter initialized');
    console.log('Found ' + filterButtons.length + ' filter buttons');
    console.log('Found ' + publications.length + ' publications');
    
    if (filterButtons.length === 0 || publications.length === 0) {
      console.warn('No buttons or publications found!');
      return;
    }
    
    // Add click handlers to each button
    for (var i = 0; i < filterButtons.length; i++) {
      filterButtons[i].addEventListener('click', function(e) {
        e.preventDefault();
        e.stopPropagation();
        
        var keyword = this.getAttribute('data-keyword');
        console.log('Clicked keyword: ' + keyword);
        
        // Update active button
        for (var j = 0; j < filterButtons.length; j++) {
          filterButtons[j].classList.remove('active');
        }
        this.classList.add('active');
        
        // Filter publications
        for (var k = 0; k < publications.length; k++) {
          var pub = publications[k];
          var pubKeywords = pub.getAttribute('data-keywords') || '';
          
          if (keyword === 'all') {
            pub.classList.remove('hidden');
          } else if (pubKeywords === '') {
            pub.classList.add('hidden');
          } else {
            var keywordList = pubKeywords.split(',');
            var found = false;
            
            for (var m = 0; m < keywordList.length; m++) {
              if (keywordList[m] === keyword) {
                found = true;
                break;
              }
            }
            
            if (found) {
              pub.classList.remove('hidden');
            } else {
              pub.classList.add('hidden');
            }
          }
        }
        
        console.log('Filtering complete for keyword: ' + keyword);
      });
    }
    
    console.log('Event listeners attached successfully');
  }
  
  // Wait for DOM to be ready
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', initFilter);
  } else {
    initFilter();
  }
})();
</script>
